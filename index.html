<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Shiza ❤️</title>
<style>
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    color: white;
  }

  .container {
    text-align: center;
  }

  h1 {
    font-size: 2.4rem;
    margin-bottom: 15px;
  }

  .heart {
    font-size: 3rem;
    animation: pulse 1.2s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }

  .buttons {
    margin-top: 25px;
  }

  button {
    padding: 12px 30px;
    border-radius: 25px;
    border: none;
    font-size: 1rem;
    cursor: pointer;
    margin: 10px;
    transition: 0.2s;
  }

  #yesBtn {
    background: #ff1e56;
    color: white;
    font-weight: bold;
  }

  #noBtn {
    background: #222;
    color: white;
    position: absolute;
  }

  .message {
    margin-top: 15px;
    font-size: 1.1rem;
  }

  .hidden {
    display: none;
  }
</style>
</head>
<body>

<div class="container" id="main">
  <div class="heart">💖</div>
  <h1>Shiza, will you be my Valentine? 🥺❤️</h1>
  <div class="buttons">
    <button id="yesBtn">Yes 😘</button>
    <button id="noBtn">No 😅</button>
  </div>
  <div class="message" id="msg"></div>
</div>

<div class="container hidden" id="success">
  <div class="heart">💘</div>
  <h1>Yayyyy!!! 🥰</h1>
  <p>Shiza, I knew you’d say yes ❤️</p>
  <p>You are the most special person in my life 💕</p>
  <p>Happy Valentine’s Day 🌹</p>
</div>

<script>
let noCount = 0;
const noBtn = document.getElementById("noBtn");
const msg = document.getElementById("msg");
const yesBtn = document.getElementById("yesBtn");
const main = document.getElementById("main");
const success = document.getElementById("success");

const messages = [
  "Shiza, don’t say no 😌",
  "You can’t escape love 😏",
  "Nice try 😜",
  "Still no? 🥺",
  "Okay okay, last chance 😈",
  "Just click YES already 😘"
];

noBtn.addEventListener("mouseover", () => {
  const x = Math.random() * (window.innerWidth - 120);
  const y = Math.random() * (window.innerHeight - 60);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  msg.innerText = messages[noCount % messages.length];
  noCount++;
});

yesBtn.addEventListener("click", () => {
  main.classList.add("hidden");
  success.classList.remove("hidden");
});
</script>

</body>
</html>
